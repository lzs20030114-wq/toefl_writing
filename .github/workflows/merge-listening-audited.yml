# 听力合库（DeepSeek 第二家族审计）— 双模型盲审的第二票。
#
# 产线时序（UTC）：R1 19:00 出题→staging；R2 19:30 补产→staging；
# R3 20:00 Claude 盲审（第一票，drop 不一致项、合并阅读/口语）；
# 本 workflow 21:00 对 R3 幸存的听力 staging 跑 DeepSeek 审计（LCR 3 票多数 +
# 任一票歧义否决；la/lc/lat 单票）后合库——听力题必须连过 Claude + DeepSeek
# 两个模型家族才能进 live 库。
#
# merge-staging.mjs 对听力严格 fail-closed：R3 环境没有 DEEPSEEK_API_KEY，
# 听力在 R3 的合库调用里被整体 HOLD（这是设计，不是故障）——只有这里能合。
#
# 手动补救：Run workflow 时填 run_id 可合指定 session 的遗留；run_id 填 "all"
# 则全量扫 staging（id/内容双去重保证已合项不会重复入库）。
name: merge-listening-audited

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      run_id:
        description: "MERGE_RUN_ID(session id)；留空=读 .routine-meta.json；\"all\"=全量扫 staging"
        required: false
        default: ""
      force:
        description: "true=跳过「R3 已审完」防护(仅当确认要合未过 Claude 盲审的批次)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: merge-listening-audited
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve session ids + R3 guard
        id: meta
        run: |
          RUN_ID="${{ inputs.run_id }}"
          FORCE="${{ inputs.force }}"
          SID=$(jq -r '.session_id // empty' data/.routine-meta.json 2>/dev/null || true)
          R2SID=$(jq -r '.r2_session_id // empty' data/.routine-meta.json 2>/dev/null || true)
          AUDIT_SID=$(jq -r '.session // empty' data/.audit-report.json 2>/dev/null || true)
          echo "sid=$SID"       >> "$GITHUB_OUTPUT"
          echo "r2sid=$R2SID"   >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          if [ -n "$RUN_ID" ]; then
            echo "manual run_id=$RUN_ID — R3 guard bypassed by operator input"
            echo "go=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$SID" ]; then
            echo "no session_id in .routine-meta.json — nothing to merge tonight"
            echo "go=false" >> "$GITHUB_OUTPUT"
          elif [ "$AUDIT_SID" != "$SID" ] && [ "$FORCE" != "true" ]; then
            # R3 的 Claude 盲审没跑完(或今晚失败)——听力保持 HOLD，宁可不合库
            echo "⏸ R3 audit receipt ($AUDIT_SID) != tonight's session ($SID); holding (use force=true to override)"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge with DeepSeek answer-audit (fail-closed)
        if: steps.meta.outputs.go == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -e
          RUN_ID="${{ steps.meta.outputs.run_id }}"
          if [ "$RUN_ID" = "all" ]; then
            node scripts/merge-staging.mjs
          elif [ -n "$RUN_ID" ]; then
            MERGE_RUN_ID="$RUN_ID" node scripts/merge-staging.mjs
          else
            MERGE_RUN_ID="${{ steps.meta.outputs.sid }}" node scripts/merge-staging.mjs
            if [ -n "${{ steps.meta.outputs.r2sid }}" ]; then
              MERGE_RUN_ID="${{ steps.meta.outputs.r2sid }}" node scripts/merge-staging.mjs
            fi
          fi

      - name: Commit merged banks
        if: steps.meta.outputs.go == 'true'
        run: |
          git config user.name "merge-audit-bot"
          git config user.email "merge-audit-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "no bank changes" && exit 0
          git commit -m "bot(merge-audited): listening merged after DeepSeek second-family audit [skip ci]"
          for i in 1 2 3 4; do
            if git pull --rebase origin main && git push origin main; then exit 0; fi
            sleep 10
          done
          exit 1
